services:
  postgres:
    image: postgres:16-alpine
    container_name: bsc-postgres
    restart: always
    environment:
      POSTGRES_DB: bsc_db
      POSTGRES_USER: bsc_user
      POSTGRES_PASSWORD: bsc_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: bsc-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@demo.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
